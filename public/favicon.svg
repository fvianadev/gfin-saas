<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="green-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#green-grad)"/>
  
  <!-- Comb (Left) -->
  <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spine of the comb -->
    <path d="M160 120 L160 360"/>
    <!-- Handle -->
    <path d="M160 360 L160 410" stroke-width="20"/>
    <!-- Teeth -->
    <path d="M160 130 L230 130"/>
    <path d="M160 155 L230 155"/>
    <path d="M160 180 L230 180"/>
    <path d="M160 205 L230 205"/>
    <path d="M160 230 L230 230"/>
    <path d="M160 255 L230 255"/>
    <path d="M160 280 L230 280"/>
    <path d="M160 305 L230 305"/>
    <path d="M160 330 L230 330"/>
    <path d="M160 355 L230 355"/>
  </g>

  <!-- Crossed Scissors (Right) -->
  <g fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Loop 1 (Bottom-Left) -->
    <circle cx="290" cy="370" r="30" stroke-width="16"/>
    <!-- Blade 1 line: from circle connector to top-right tip -->
    <path d="M305 345 L380 140"/>
    
    <!-- Loop 2 (Bottom-Right) -->
    <circle cx="390" cy="370" r="30" stroke-width="16"/>
    <!-- Blade 2 line: from circle connector to top-left tip -->
    <path d="M375 345 L280 140"/>

    <!-- Pivot Screw -->
    <circle cx="338" cy="270" r="6" fill="#ffffff" stroke="none"/>
  </g>
</svg>